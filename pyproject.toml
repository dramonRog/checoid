[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checoid"
version = "0.1.0"
description = "AI-Driven Receipt Extraction Pipeline"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
